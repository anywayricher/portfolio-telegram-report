name: Daily Telegram Report

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'
    - cron: '0 16 * * *'

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Report
        run: |
          curl -s -X POST \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            -d "chat_id=anywayRicher" \
            -d "text=📊 포트폴리오 일일 리포트%0A📅 2026-07-20%0A%0A💰 현재 자산: 47,252만원%0A💵 현재 수익금: +13,252만원%0A📊 현재 수익률: +39.0%25%0A%0A🏦 메리츠증권: 17,290만원%0A🏦 미래에셋증권: 29,962만원%0A%0A⚠️ 전반적 낙폭" \
            https://api.telegram.org/bot8916195612:AAEie0m5GmzTby2dqRD1Zcp69ld2p00Jxfs/sendMessage
